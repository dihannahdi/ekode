name: windows-installer

# Builds ekode.exe natively on a GitHub Windows runner, wraps it in an Inno
# Setup installer, and proves the installer uninstalls clean.
#
# Deliberately separate from publish.yml: every job in that workflow is gated
# `if: github.repository == 'anomalyco/opencode'` and runs on Blacksmith
# runners this repo does not have, so none of it executes in a fork.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the installer (default: 0.0.0-ci-<run number>)"
        required: false
        type: string
  push:
    tags:
      # a tag is what publishes; see the release job at the bottom
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/windows-installer.yml"
      - "packages/opencode/installer/**"
      - "packages/opencode/script/build.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag run: the release job uploads the exe and SHA256SUMS.txt
  # as two calls, and a cancel between them leaves a release with the installer
  # and no checksum. Re-pushing a tag keeps the same github.ref, so without
  # this a routine tag fix could truncate a published release. publish.yml:27
  # omits cancel-in-progress for the same reason.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  # build.ts derives the channel from `git branch --show-current`, which is
  # empty on Actions' detached-HEAD checkout, giving "0.0.0--<timestamp>".
  #
  # Deliberately NOT 'latest' on tags. Anything other than 'latest' keeps
  # IS_PREVIEW true, which keeps the binary's update check off -- and that check
  # is currently wrong for ekode: an installer-installed exe lives in
  # %LOCALAPPDATA%\Programs\Ekode\bin, which Installation.method() does not
  # recognise (installation/index.ts:174-205), so it returns "unknown",
  # Installation.latest() falls through to its default branch and queries
  # api.github.com/repos/anomalyco/opencode/releases/latest (index.ts:257).
  # Users would be told forever to upgrade to upstream opencode, and
  # `ekode upgrade` would die on "Unknown installation method: unknown".
  # Turning the update check on needs ekode's own release endpoint and an
  # installer-aware Method first. See the PR description.
  OPENCODE_CHANNEL: ci

jobs:
  build:
    name: build ekode.exe (windows-x64)
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_info: ${{ steps.version.outputs.version_info }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Resolve version
        id: version
        shell: bash
        env:
          # Never interpolate a workflow input into the script body. GitHub
          # substitutes ${{ }} textually before bash parses the line, so a
          # version of "$(curl ... | bash)" would execute on the runner -- and
          # again in the installer job, where PowerShell's $() also runs inside
          # a double-quoted string. Passing through env keeps it data.
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            # v1.2.3 -> 1.2.3, so the installed name is not "Ekode v1.2.3"
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="0.0.0-ci-$RUN_NUMBER"
          fi

          # VersionInfoVersion is the Windows file-version resource. It must be
          # numeric a.b.c.d with every component <= 65535, and it is not what
          # users see -- AppVersion carries the real string, pre-release suffix
          # and all. The run number takes the 4th slot so 1.0.0-rc1, 1.0.0-rc2
          # and 1.0.0 do not all collapse onto the same 1.0.0.0 and become
          # indistinguishable in file properties.
          NUM=$(printf '%s' "$VERSION" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)
          if [ -z "$NUM" ]; then NUM="0.0.0"; fi

          # Pad to exactly three components BEFORE cutting. `cut -d. -f2`
          # returns the whole line when the delimiter is absent, so a version
          # of "1" would otherwise come out as 1.1.1.<run>.
          while [ "$(printf '%s' "$NUM" | tr -cd '.' | wc -c)" -lt 2 ]; do
            NUM="$NUM.0"
          done
          A=$(printf '%s' "$NUM" | cut -d. -f1)
          B=$(printf '%s' "$NUM" | cut -d. -f2)
          C=$(printf '%s' "$NUM" | cut -d. -f3)

          # Every component must be <= 65535 or ISCC rejects it. Rather than
          # clamp -- which would silently turn a CalVer 20260904.1 into
          # 65535.1.0.x and assert a version that is not the version -- say
          # plainly that the number is unrepresentable and fall back.
          if [ "$A" -gt 65535 ] || [ "$B" -gt 65535 ] || [ "$C" -gt 65535 ]; then
            echo "note: $NUM has a component above 65535, which the Windows"
            echo "      file-version resource cannot hold. Falling back to 0.0.0."
            echo "      AppVersion still carries the real version, $VERSION."
            A=0; B=0; C=0
          fi

          # modulo, not clamp, so consecutive builds keep distinct 4th slots
          D=$((RUN_NUMBER % 65536))
          VERSION_INFO="$A.$B.$C.$D"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_info=$VERSION_INFO" >> "$GITHUB_OUTPUT"
          echo "version = $VERSION   version_info = $VERSION_INFO"

      - name: Build
        shell: bash
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # --single builds only the host target (windows-x64). That is also the
          # only configuration where build.ts runs its `ekode --version` smoke
          # test (build.ts:200 gates it on item.os === process.platform), so a
          # native build is the only one that proves the binary actually starts.
          #
          # --skip-install because build.ts:139-143 otherwise runs its own
          # `bun install --os="*" --cpu="*"`, which re-links node_modules with
          # Bun's isolated linker and undoes the `--linker hoisted` layout that
          # setup-bun applies on Windows (oven-sh/bun#28147). node-gyp then
          # stops resolving and tree-sitter-powershell's install script dies:
          #   Cannot find module '...\node_modules\node-gyp\bin\node-gyp.js'
          # Those installs fetch natives for *every* target; with --single we
          # build only the host, whose natives setup-bun already installed.
          bun run packages/opencode/script/build.ts --single --skip-install

      - name: Show what was built
        shell: pwsh
        run: |
          $dir = "packages/opencode/dist/opencode-windows-x64/bin"
          if (-not (Test-Path $dir)) { throw "Build produced nothing at $dir" }
          Get-ChildItem $dir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          & "$dir/ekode.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "ekode.exe --version exited $LASTEXITCODE" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ekode-windows-x64
          path: packages/opencode/dist/opencode-windows-x64/bin
          if-no-files-found: error

  installer:
    name: build installer
    needs: build
    runs-on: windows-2025
    env:
      # Pinned like every action in this file. Inno Setup is the one tool that
      # decides what users actually download, so it should not float: a 6.x
      # point release can change compression or [Code] semantics with no diff
      # to review, and an Inno Setup 7 would install to a different directory
      # and break the path below with no repo change at all.
      #
      # This is the CHOCOLATEY package version, which lags upstream -- choco's
      # newest is 6.7.1 while jrsoftware ships 6.7.3, so do not copy the
      # version out of winget or the download page. Check what exists first:
      #   curl -s "https://community.chocolatey.org/api/v2/FindPackagesById()?id='innosetup'&\$orderby=Version%20desc&\$top=5"
      INNO_VERSION: "6.7.1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # this job needs only ekode.iss and the LICENSE it references, not a
          # 236 MB tree
          sparse-checkout: |
            packages/opencode/installer
            LICENSE
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ekode-windows-x64
          path: build/bin

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=$env:INNO_VERSION --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup exited $LASTEXITCODE" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC: $iscc"

      - name: Compile installer
        shell: pwsh
        env:
          # through env, not ${{ }} in the script body: PowerShell runs $( )
          # inside double-quoted strings, so an interpolated version string
          # would execute here as well as in the bash step that produced it
          APP_VERSION: ${{ needs.build.outputs.version }}
          VERSION_INFO: ${{ needs.build.outputs.version_info }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = (Resolve-Path "build/bin").Path
          $out = (Resolve-Path "dist").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DSourceDir=$src" `
            "/DAppVersion=$($env:APP_VERSION)" `
            "/DVersionInfo=$($env:VERSION_INFO)" `
            "/DOutputDir=$out" `
            "packages\opencode\installer\ekode.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          Get-ChildItem dist | Format-Table Name, Length -AutoSize

      # --- code signing slots in here -------------------------------------
      # Upstream signs with Azure Artifact Signing (formerly Trusted Signing);
      # publish.yml:120-218 has the working shape to copy.
      #
      # Publisher identity is decided: "Eko AI". AppPublisher in ekode.iss is
      # set to match, so the wizard, Add/Remove Programs and the eventual
      # certificate all say one thing.
      #
      # Still blocked on the Public Trust certificate profile, which needs an
      # *organisation* identity validation for Eko AI -- registered entity,
      # documents issued in the last 12 months, matching name, address and
      # domain registration. The Azure subscription paying for it does not have
      # to be the same entity, but the validated identity is what lands on the
      # certificate. The step stays absent rather than half-wired until that
      # profile exists; until then every download shows "Windows protected your
      # PC" and SHA256SUMS.txt in the release is the only integrity check.
      # --------------------------------------------------------------------

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ekode-setup-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  verify-uninstall:
    name: verify clean uninstall
    needs: installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # only verify-uninstall.ps1 is needed here
          sparse-checkout: packages/opencode/installer
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ekode-setup-windows-x64
          path: dist

      - name: Install, diff, uninstall, diff
        shell: powershell
        run: |
          $setup = Get-ChildItem dist -Filter "ekode-setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "No setup exe in dist" }
          .\packages\opencode\installer\verify-uninstall.ps1 -Setup $setup.FullName -WorkDir "$env:RUNNER_TEMP\uninstall-check"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: uninstall-snapshots
          path: ${{ runner.temp }}/uninstall-check
          if-no-files-found: warn

  release:
    name: attach installer to the release
    # Only a tag publishes. Everything else stops at the artifact.
    if: github.ref_type == 'tag'
    # verify-uninstall is in `needs` on purpose: an installer that failed the
    # clean-uninstall check must not be able to reach a release.
    needs:
      - build
      - installer
      - verify-uninstall
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ekode-setup-windows-x64
          path: dist

      - name: Checksum
        working-directory: dist
        run: |
          ls -la
          # The installer is unsigned, so this file is the only integrity check
          # a user has. Keep publishing it even after signing is wired up.
          sha256sum *.exe | tee SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # semver: a hyphen means pre-release. Without this a v1.0.0-rc1 tag
          # publishes as "Latest" and becomes the download users land on.
          PRERELEASE=""
          case "${TAG#v}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --verify-tag \
              --generate-notes \
              $PRERELEASE
          fi
          gh release upload "$TAG" dist/*.exe dist/SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "Published:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes"'
